# Settings come from .env (see .env.example). Caddy and Cloudflare Tunnel are optional and only
# start when listed in COMPOSE_PROFILES.
services:

  app:
    # Ready-made image from GitHub. "1" follows every 1.x release, which never breaks your
    # setup; a new major version (2) is a deliberate switch. "docker compose up --build"
    # builds from this folder instead.
    image: ghcr.io/yuw1xx/resonance-share:${SERVER_VERSION:-1}
    build: .
    restart: unless-stopped
    environment:
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:?Set UPLOAD_TOKEN in .env}
      TRUST_PROXY: ${TRUST_PROXY:-none}
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
      TTL_HOURS: ${TTL_HOURS:-24}
      MAX_TTL_HOURS: ${MAX_TTL_HOURS:-72}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      RATE_LIMIT_MB_PER_HOUR: ${RATE_LIMIT_MB_PER_HOUR:-3072}
      RATE_LIMIT_REQUESTS_PER_HOUR: ${RATE_LIMIT_REQUESTS_PER_HOUR:-300}
      MAX_STORAGE_GB: ${MAX_STORAGE_GB:-20}
    ports:
      - "${PUBLISH:-8080}:8080"
    volumes:
      - share_data:/data

  # Own domain with automatic HTTPS (COMPOSE_PROFILES=caddy).
  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    environment:
      SHARE_DOMAIN: ${SHARE_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Cloudflare Tunnel, no open ports needed (COMPOSE_PROFILES=cloudflare).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflare]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared:ro
    depends_on:
      - app

volumes:
  share_data:
  caddy_data:
  caddy_config:
